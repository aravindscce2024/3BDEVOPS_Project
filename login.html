<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Event Registration</title>
<style>
    body {
      font-family: Arial, sans-serif;
      background: #c3eb12;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #dc881b ;
      padding: 20px;
      border-radius: 8px;
      width: 350px;
      box-shadow: 0 0 40px rgba(143, 137, 21, 0.49);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      box-sizing: border-box;
    }

    button {
      margin-top: 20px;
      background: #4b15dd;
      color: white;
      border: none;
      cursor: pointer;
    }

button:hover {
      background: #f55815;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      color: green;
      font-weight: bold;
    }
</style>
</head>
<body>

<div class="container">
<h2>Event Registration</h2>

<form id="registrationForm">
<label for="name">Full Name</label>
<input
      type="text"
      id="name"
      name="name"
      required
    />

<label for="email">Email</label>
<input
      type="email"
      id="email"
      name="email"
      required
    />

<label for="ticket">Attendance Type</label>
<select id="ticket" name="ticket" required>
	<option value="">Select an option</option>
	<option value="In Person">In Person</option>
	<option value="Virtual">Virtual</option>
</select>

<button type="submit">Register</button>
</form>

<div class="message" id="message"></div>
</div>

<script>
const form = document.getElementById("registrationForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(event) {
event.preventDefault();

const name = document.getElementById("name").value.trim();
const email = document.getElementById("email").value.trim();
const ticket = document.getElementById("ticket").value;

    if (!name || !email || !ticket) {
message.style.color = "red";
message.textContent = "Please complete all fields.";
      return;
    }

message.style.color = "white";
message.textContent =
      ` Thank you, ${name}! You have successfully registered for the event (${ticket}).`;

form.reset();
  });
</script>

</body>
</html>
